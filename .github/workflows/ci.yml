name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Build desktop app bundle
        run: MAC_DEV_BRIDGE_INSTALL_APP=0 ./menubar/build.sh

      - name: Test
        run: npm test

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # Never execute fork-controlled code on the operator's Mac. Same-repository
    # branches and main are trusted because this is a private personal repo.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, mdb-ci]
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Syntax check
        run: npm run check

      - name: Build desktop app bundle
        run: MAC_DEV_BRIDGE_INSTALL_APP=0 ./menubar/build.sh

      - name: Test
        run: npm test

name: Native Desktop E2E

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-desktop-e2e:
    runs-on: [self-hosted, macOS, ARM64, mdb-native-e2e]
    timeout-minutes: 30
    env:
      MDB_RUN_NATIVE_DESKTOP_E2E: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Syntax and native build checks
        run: npm run check
      - name: Real mutable desktop fixture
        run: node tests/desktop-control-native.mjs
